name: Deploy Lambda Docker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      AWS_LAMBDA_FUNCTION_NAME: ${{ vars.AWS_LAMBDA_FUNCTION_NAME }}
      AWS_ECR_REPOSITORY_URL: ${{ vars.AWS_ECR_REPOSITORY_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ vars.AWS_ECR_AUTH_ENDPOINT }}

      - name: Build Docker image
        run: |
          docker build -t $AWS_ECR_REPOSITORY_URL:latest .

      - name: Push Docker image to ECR
        run: |
          docker push $AWS_ECR_REPOSITORY_URL:latest

      - name: Update Lambda function
        run: |
          aws lambda update-function-code \
            --function-name $AWS_LAMBDA_FUNCTION_NAME \
            --image-uri $AWS_ECR_REPOSITORY_URL:latest
